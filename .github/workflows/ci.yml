name: RailBlock-AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  conflict-marker-check:
    name: Check for Residual Conflict Markers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan codebase for conflict markers
        run: |
          echo "Scanning codebase for unresolved git conflict markers..."
          if git grep -n -E '^(<|>|=){7}( |$)'; then
            echo "ERROR: Unresolved git conflict markers found in codebase!"
            exit 1
          else
            echo "Clean codebase: No git conflict markers found."
          fi

  python-lint:
    name: Python Flake8 Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install flake8
        run: pip install flake8

      - name: Lint Python with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  unittest-suite:
    name: Python Unittest Discovery Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run unit test suite
        run: |
          python -m unittest discover -s tests

  pytest-suite:
    name: Pytest Engine Test Runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run test suite with pytest
        run: |
          pytest

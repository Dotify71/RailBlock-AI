name: RailBlock-AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8

      - name: Check for residual git conflict markers
        run: |
          echo "Scanning codebase for unresolved git conflict markers..."
          if git grep -n -E '^(<|>|=){7}( |$)'; then
            echo "ERROR: Unresolved git conflict markers found in codebase!"
            exit 1
          else
            echo "Clean codebase: No git conflict markers found."
          fi

      - name: Lint Python with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run unit test suite (unittest)
        run: |
          python -m unittest discover -s tests

      - name: Run test suite with pytest
        run: |
          pytest
